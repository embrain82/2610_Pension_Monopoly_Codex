const root=document.body;
function setMode(mode){const resume=mode==='resume';root.classList.toggle('resume',resume);document.querySelector('.primary-label').textContent=resume?'이어서 플레이':'새 판 시작 준비';document.querySelector('.secondary').hidden=!resume;document.querySelector('.start-hint').textContent=resume?'다시 시작하려면 아래에서 새 판을 준비하세요.':'성향 확인 → 디폴트옵션 선택 → 게임 시작';}
setMode(new URLSearchParams(location.search).get('state')||'new');
window.addEventListener('message',e=>{if(e.source===window.parent&&e.data?.type==='design-state')setMode(e.data.state)});
const dialog=document.querySelector('dialog');
document.querySelectorAll('[data-demo]').forEach(b=>b.addEventListener('click',()=>{const kind=b.dataset.demo;const isStart=kind==='start'||kind==='new';document.querySelector('#demo-title').textContent=isStart?(root.classList.contains('resume')&&kind==='start'?'저장된 판 이어가기':'새 판 준비 흐름'):(kind==='settings'?'환경설정':'게임을 알아보세요');document.querySelector('#demo-content').innerHTML=isStart?(root.classList.contains('resume')&&kind==='start'?'<p>예시 저장 정보: 4턴 진행 중 · 코알라.</p><p>선택한 디자인의 이어하기 버튼 모습입니다.</p>':'<ol><li>교육용 게임 안내와 이용 동의</li><li>투자자성향 확인 또는 진단</li><li>추천과 현재 선택을 구분한 디폴트옵션 선택</li><li>캐릭터·시나리오 확인 후 시작</li></ol>'):'<p>실제 구현 시 현재의 '+(kind==='settings'?'소리·캐릭터·접근성 설정':'학습카드·도움말·사용자 및 운영자 매뉴얼')+'을 연결합니다.</p>';dialog.showModal();}));
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>dialog.close()));
</script></body></html>
