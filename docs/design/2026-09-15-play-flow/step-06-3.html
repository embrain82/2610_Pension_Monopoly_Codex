  if(b.dataset.payout!==undefined){payout=Number(b.dataset.payout);$$('.payout-option').forEach((x,i)=>{x.classList.toggle('selected',i===payout);x.setAttribute('aria-checked',String(i===payout));});$('.payout-chosen').textContent=payout===0?'연금 20년 수령':'일시금 수령';$('.payout-monthly').textContent=money(sample.payoutPlans[payout].monthlyBasis);$('.payout-mission').textContent=sample.payoutPlans[payout].monthlyBasis>=500000?'목표 월 50만원 달성':'목표 월 50만원 미달';}
  if(b.dataset.tile!==undefined){const name=b.getAttribute('aria-label');toast(name+' · 게임판 디자인 미리보기');}
  switch(b.dataset.act){case 'close':toast('화면 닫기 예시 · 조회·취소로 행동 횟수가 줄지 않아요.');break;case 'dialog-close':close();break;case 'roll':roll();break;case 'no-option':$$('.option').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-checked','false')});$$('.choice-name').forEach(x=>x.textContent='지정 안 함');break;case 'diagnose':questionIndex=0;diagnosis();break;case 'diagnosis-answer':if(questionIndex<4){questionIndex++;diagnosis();}else{open('성향 확인으로 돌아갑니다','<p>5문항 진행 방식의 디자인 예시입니다. 실제 진단 점수와 성향은 적용 시 기존 진단 엔진으로 계산합니다.</p>',primary('시안의 성향 확인','dialog-close'));}break;case 'hold':go('11');break;case 'order-confirm':open('운용지시 확인','<p>'+$('.trade-kind').textContent+'</p><p>'+($('.amount-form').hidden?'직접 운용분의 목표비중으로 조정':money(Number($('#amount').value)))+'</p><p>확정 시에만 행동 1회를 사용합니다.</p>',primary('지시 확정 · 정산 보기','order-done'));break;case 'default-confirm':open(defaultMode===0?'옵트인 지시 확인':'옵트아웃 지시 확인','<p>'+$('.default-preview-lines').textContent+'</p><p>'+$('.default-rule').textContent+'</p>',primary('지시 확정 · 정산 보기','order-done'));break;case 'order-done':go('11');break;case 'quiz-skip':case 'settlement-next':quizSkip();break;case 'goto-quiz':if(document.body.dataset.stage==='10')close();else go('10');break;case 'skip-confirm':quizAcknowledged=true;go('03');break;case 'risk-continue':document.body.dataset.riskAck='yes';close();break;case 'life-confirm':go('06');break;case 'finish':open('12턴의 여정을 마쳤어요','<img class="mascot finish-art" src="'+(window.ASSETS?.journey||'assets/journey-a.jpg')+'" alt="올리·원이와 완주"><p>최종 IRP <b>132,000,000원</b><br>'+$('.payout-chosen').textContent+'<br>목표용 월 환산액 '+money(sample.payoutPlans[payout].monthlyBasis)+'</p><p>'+$('.payout-mission').textContent+' · 이번 판에서 배운 내용을 돌아보세요.</p>',primary('수령 방식 다시 비교','dialog-close')+secondary('새 판 준비 화면','new-start'));break;case 'new-start':go('01');break;}
 });
 $('#amount')?.addEventListener('input',updateAmount);$('#default-option')?.addEventListener('change',e=>{option=Number(e.target.value);updateAmount();});
 window.addEventListener('message',e=>{if(e.source!==parent)return;if(e.data?.type==='flow-mode'&&document.body.dataset.stage==='07'){const n=['buy','sell','switch','rebalance','contribute'].indexOf(e.data.action);if(n>=0)setTab('일반 운용',n);return;}if(e.data?.type!=='flow-state')return;example=e.data.state;delete document.body.dataset.riskAck;availability();if(document.body.dataset.stage==='10')$('.eyebrow').textContent=example==='cap'?'선택 학습 · 추가 점수 없이 복습':'선택 학습 · 정답이면 이해 +2점';});
 $$('[role="radio"]').forEach(b=>b.addEventListener('keydown',e=>{if(!['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(e.key))return;e.preventDefault();const group=[...b.parentElement.querySelectorAll('[role="radio"]')],dir=['ArrowDown','ArrowRight'].includes(e.key)?1:-1;const x=group[(group.indexOf(b)+dir+group.length)%group.length];x.click();x.focus();}));
 availability();
 if(document.body.dataset.stage==='07'){try{const names=['buy','sell','switch','rebalance','contribute'],saved=new URLSearchParams(location.search).get('action');if(names.includes(saved))setTab('일반 운용',names.indexOf(saved));}catch{}}
})();
